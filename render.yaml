services:
  - type: web
    name: study-companion
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BETA_ADMIN_KEY
        generateValue: true
      - key: BETA_INVITE_ONLY
        value: "true"
      - key: ALLOW_ANONYMOUS_SESSIONS
        value: "false"
      - key: DATA_DIR
        value: /tmp/study-companion
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: MAX_FILE_SIZE_MB
        value: "25"
      - key: OCR_ENABLED
        value: "false"
      # Optional paid checkout. Without both values, registered beta users can
      # activate the Plus plan themselves from Settings.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        value: https://study-companion-o7k3.onrender.com
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
