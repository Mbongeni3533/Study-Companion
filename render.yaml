# Render blueprint for Study Companion.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repository.
# The disk keeps the SQLite database and uploaded files across deploys and
# restarts; without a disk Render wipes that data on every deploy.
services:
  - type: web
    name: study-companion
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 0.5 CPU / 512 MB, the smallest plan that can attach a disk (~$7/month).
    plan: 0.5c-512mb
    region: frankfurt
    healthCheckPath: /health
    disk:
      name: study-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Generated once by Render and kept secret; rotating it signs everyone out.
      - key: JWT_SECRET
        generateValue: true
      # Optional: set in the dashboard to enable the AI coach (rules-based without it).
      - key: ANTHROPIC_API_KEY
        sync: false
