name: study-companion

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - study_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  study_data:
    name: study_companion_data
  caddy_data:
    name: study_companion_caddy_data
  caddy_config:
    name: study_companion_caddy_config
